<!DOCTYPE html>
<html lang="fr" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable • Marouki Frippe</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            goldDark: '#AA820A',
                            red: '#8B0000',
                            crimson: '#DC143C',
                            dark: '#0A0A0A',
                            card: '#121212',
                            border: '#2A2A2A'
                        }
                    },
                    fontFamily: {
                        garet: ['Garet', 'Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Garet';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: local('Garet Book'), local('Garet'), url('fonts/Garet-Book.woff') format('woff'), url('https://fonts.cdnfonts.com/s/57477/Garet-Book.woff') format('woff');
        }

        body {
            background-color: #030303;
            color: #F3F4F6;
            font-family: 'Garet', 'Plus Jakarta Sans', sans-serif;
            font-weight: 400;
            letter-spacing: 0.01em;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center select-none">

    <div class="max-w-md w-full bg-black/70 backdrop-blur-2xl border border-brand-red/40 p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden">
        
        <!-- Glowing Ambient Accent -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-brand-crimson/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-brand-gold/15 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo -->
        <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-black/80 border border-brand-gold/40 flex items-center justify-center p-2.5 shadow-xl shadow-black/80">
            <img src="logo.svg" alt="Marouki Frippe" class="w-full h-full object-contain">
        </div>

        <!-- 404 Badge -->
        <span class="inline-block bg-brand-crimson/20 text-brand-crimson text-xs font-medium uppercase tracking-widest px-3 py-1 rounded-full border border-brand-crimson/30 mb-4 font-mono">
            Erreur 404
        </span>

        <!-- Heading -->
        <h1 class="text-3xl font-normal font-garet tracking-normal text-white mb-2">
            Page Introuvable
        </h1>

        <p class="text-xs sm:text-sm text-gray-400 font-light leading-relaxed mb-8">
            La pièce ou la page recherchée n'existe pas ou a été déplacée. Explorez notre collection exclusive de pièces uniques directement en vitrine.
        </p>

        <!-- Action Button -->
        <a href="/" class="w-full inline-flex items-center justify-center gap-2.5 bg-gradient-to-r from-brand-red via-brand-crimson to-brand-red hover:brightness-110 text-white font-medium text-xs uppercase tracking-luxury py-4 px-6 rounded-xl transition-all shadow-xl shadow-brand-red/30 group">
            <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform"></i>
            <span>Retour à la Boutique</span>
        </a>

        <div class="mt-8 pt-6 border-t border-gray-800/80 text-[11px] text-gray-500 flex items-center justify-center gap-2">
            <span>Marouki Frippe</span>
            <span>•</span>
            <span class="text-brand-gold">Pièces Rares & Vintage</span>
        </div>
    </div>

</body>
</html>
