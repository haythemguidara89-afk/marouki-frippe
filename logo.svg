<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#b50819"/>
      <stop offset="50%" stop-color="#8a000e"/>
      <stop offset="100%" stop-color="#4d0006"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner vignette ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Main Thin Circle -->
  <circle cx="250" cy="285" r="145" fill="none" stroke="#220003" stroke-width="2.5" opacity="0.85"/>
  <circle cx="250" cy="285" r="145" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Left Sparkle Star -->
  <g transform="translate(105, 285)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#200003"/>
    <path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Right Sparkle Star -->
  <g transform="translate(395, 285)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#200003"/>
    <path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Big Serif Monogram "M" -->
  <text x="250" y="225" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" 
        font-size="160" 
        font-weight="600" 
        fill="#ffffff" 
        letter-spacing="1"
        filter="url(#softShadow)">M</text>

  <!-- Calligraphy "Marouki" -->
  <text x="250" y="275" 
        text-anchor="middle" 
        font-family="'Alex Brush', 'Playfair Display', cursive, serif" 
        font-size="62" 
        font-style="italic" 
        font-weight="400" 
        fill="#ffffff" 
        filter="url(#softShadow)">Marouki</text>

  <!-- Clean Sans-Serif "BOUTIQUE" -->
  <text x="250" y="318" 
        text-anchor="middle" 
        font-family="'Poppins', 'Montserrat', 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="400" 
        letter-spacing="9" 
        fill="#ffffff" 
        opacity="0.95">BOUTIQUE</text>

  <!-- Calligraphy "Frippe" -->
  <text x="250" y="375" 
        text-anchor="middle" 
        font-family="'Alex Brush', 'Playfair Display', cursive, serif" 
        font-size="60" 
        font-style="italic" 
        font-weight="400" 
        fill="#ffffff" 
        filter="url(#softShadow)">Frippe</text>
</svg>
