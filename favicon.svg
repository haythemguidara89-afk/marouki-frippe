<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Royal Velvet Crimson Radial Gradient -->
    <radialGradient id="favBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#db0f1f"/>
      <stop offset="35%" stop-color="#a30312"/>
      <stop offset="70%" stop-color="#5a0109"/>
      <stop offset="100%" stop-color="#240003"/>
    </radialGradient>

    <!-- Haute Couture Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7b9"/>
      <stop offset="30%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#c59942"/>
      <stop offset="100%" stop-color="#fae7b9"/>
    </linearGradient>

    <!-- Luxury Depth Drop Shadow -->
    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    .fav-monogram {
      font-family: 'Playfair Display', Didot, 'Bodoni 72', 'Bodoni MT', 'Times New Roman', Georgia, serif;
      font-size: 280px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0px;
    }
  </style>

  <!-- Luxurious Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#favBg)"/>

  <!-- Outer Haute Couture Gold Border -->
  <rect x="22" y="22" width="468" height="468" rx="114" fill="none" stroke="url(#favGold)" stroke-width="8" opacity="0.9"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- Concentric Inner Circle -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#favGold)" stroke-width="2.5" opacity="0.45" stroke-dasharray="8 6"/>

  <!-- Top-Right Sparkle Diamond Star -->
  <g transform="translate(382, 130)" filter="url(#favDropShadow)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="url(#favGold)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Bottom-Left Accent Sparkle Star -->
  <g transform="translate(130, 382)" opacity="0.85">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="url(#favGold)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Centered Haute Couture Monogram "M" -->
  <text x="256" y="348" class="fav-monogram" filter="url(#favDropShadow)">M</text>
</svg>
